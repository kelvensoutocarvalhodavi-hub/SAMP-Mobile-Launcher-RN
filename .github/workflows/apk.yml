name: Gerar APK Max City

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Forçar SDK 34 (Android 15) via Python
        run: |
          python3 -c '
          import glob, re
          files = glob.glob("android/**/build.gradle", recursive=True) + glob.glob("build.gradle")
          for path in files:
              with open(path, "r") as f:
                  content = f.read()
              content = re.sub(r"(compileSdkVersion\s*[=:]\s*)\d+", r"\g<1>34", content)
              content = re.sub(r"(targetSdkVersion\s*[=:]\s*)\d+", r"\g<1>34", content)
              content = re.sub(r"(minSdkVersion\s*[=:]\s*)\d+", r"\g<1>30", content)
              content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", content)
              content = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 34", content)
              content = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 30", content)
              with open(path, "w") as f:
                  f.write(content)
          print("SDKs atualizados com sucesso para a versão 34!")
          '

      - name: Dar permissão de execução
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxCity-Roleplay-APK
          path: android/app/build/outputs/apk/debug/*.apk






          
